<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/head.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Novary conçoit des applications web et mobiles et accompagne les équipes du cadrage au lancement." />
    <title>Novary — Studio de produits numériques</title>
    <script>
      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      try {
        const saved = localStorage.getItem('theme')
        if (saved === 'light' || saved === 'dark') theme = saved
      } catch {
        // The system preference still works when browser storage is unavailable.
      }
      document.documentElement.dataset.theme = theme
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
